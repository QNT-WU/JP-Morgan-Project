[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "risky-model-tf"
version = "0.2.0"
description = "Risky debt (k,b,z) model with TensorFlow-based training, benchmarking, and estimation workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tensorflow",
    "tensorflow-probability",
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["risky_debt*", "Experiment*", "estimation*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["Test"]
markers = [
    "slow: slower smoke or integration tests that still remain suitable for occasional pytest runs",
]
